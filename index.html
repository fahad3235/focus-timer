<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Timer — ফোকাস টাইমার</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">◉</span>
    <div>
      <h1 data-i18n="title">Focus Timer</h1>
      <p class="tagline" data-i18n="tagline">Deep work, one block at a time.</p>
    </div>
  </div>
  <button id="langToggle" class="lang-toggle" type="button" aria-label="Switch language">বাং</button>
</header>

<main>
  <section class="card timer-card" aria-label="Timer">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 200 200" role="img" aria-label="Progress">
        <circle class="ring-track" cx="100" cy="100" r="88"></circle>
        <circle id="ringProg" class="ring-prog" cx="100" cy="100" r="88"></circle>
      </svg>
      <div class="ring-center">
        <div id="phaseLabel" class="phase" data-i18n="phase_focus">Focus</div>
        <div id="timeDisplay" class="time" aria-live="polite">25:00</div>
        <div id="cycleLabel" class="cycle"></div>
      </div>
    </div>
    <div class="controls">
      <button id="btnMain" class="btn primary" type="button" data-i18n="start">Start</button>
      <button id="btnReset" class="btn" type="button" data-i18n="reset">Reset</button>
      <button id="btnSkip" class="btn" type="button" data-i18n="skip">Skip</button>
    </div>
    <p id="permNote" class="perm-note" hidden></p>
  </section>

  <section class="card" aria-label="Settings">
    <h2 data-i18n="settings">Settings</h2>
    <div class="settings-grid">
      <label>
        <span data-i18n="focusMin">Focus (min)</span>
        <input id="inFocus" type="number" min="1" max="180" step="1" value="25">
      </label>
      <label>
        <span data-i18n="shortMin">Short break (min)</span>
        <input id="inShort" type="number" min="1" max="60" step="1" value="5">
      </label>
      <label>
        <span data-i18n="longMin">Long break (min)</span>
        <input id="inLong" type="number" min="1" max="90" step="1" value="15">
      </label>
      <label>
        <span data-i18n="rounds">Sessions before long break</span>
        <input id="inRounds" type="number" min="1" max="12" step="1" value="4">
      </label>
    </div>
    <p id="settingsError" class="error" role="alert" hidden></p>
  </section>

  <section class="card" aria-label="Statistics">
    <h2 data-i18n="stats">Statistics</h2>
    <div class="stats-grid">
      <div class="stat"><div id="statToday" class="stat-num">0</div><div class="stat-label" data-i18n="today">Today</div></div>
      <div class="stat"><div id="statWeek" class="stat-num">0</div><div class="stat-label" data-i18n="thisWeek">This week</div></div>
      <div class="stat"><div id="statSessions" class="stat-num">0</div><div class="stat-label" data-i18n="sessions">Sessions</div></div>
    </div>
  </section>

  <section class="card" aria-label="History">
    <h2 data-i18n="history">History</h2>
    <ul id="historyList" class="history"></ul>
    <p id="historyEmpty" class="empty" data-i18n="emptyHistory">No sessions yet — finish a focus block to see it here.</p>
  </section>
</main>

<footer>
  <p data-i18n="footer">Fully offline. Your data never leaves this browser.</p>
</footer>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
